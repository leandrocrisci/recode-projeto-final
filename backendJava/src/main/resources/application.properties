spring.application.name=Recode Projeto Final

# ===========================
# Banco de Dados MySQL
# ===========================

# spring.datasource.url=jdbc:mysql://localhost:3306/recodedatabase?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do PostgreSQL (Render / Produção)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# Servidor
# ===========================
server.port=${PORT:8090}

# CORS: URLs do frontend separadas por vírgula; configure CORS_ALLOWED_ORIGINS no Render.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174,https://frontendweb-rcs5.onrender.com}

# Chave HMAC do JWS. Obrigatória. Defina JWT_SECRET no ambiente (Render/local), nunca no Git.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Opcional: primeiro administrador (professor com senha) criado na inicialização.
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}
app.admin.nome=${ADMIN_NOME:Administrador}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

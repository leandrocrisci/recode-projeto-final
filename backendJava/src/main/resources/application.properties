# Configuração do PostgreSQL (Render / Produção)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# Servidor
# ===========================
server.port=8090

# CORS: URLs do frontend separadas por vírgula; configure CORS_ALLOWED_ORIGINS no Render.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174,https://frontendweb-rcs5.onrender.com}

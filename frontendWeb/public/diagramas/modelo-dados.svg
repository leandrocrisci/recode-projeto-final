<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama entidade-relacionamento do projeto</title>
  <desc id="desc">Diagrama das onze entidades JPA e dos relacionamentos Many-to-one e one-to-one definidos nos modelos Java.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#60758b"/></marker>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172b4d}.title{font-size:24px;font-weight:700}.entity{font-size:15px;font-weight:700}.rel{font-size:13px}.note{font-size:13px}.edge{fill:none;stroke:#60758b;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="680" rx="16" fill="#f7f9fc"/>
  <text x="600" y="42" text-anchor="middle" class="title">Modelo de dados — entidades e cardinalidades</text>
  <g class="edge">
    <path d="M105 270V165"/><path d="M180 298H260"/><path d="M180 280H215V148H500"/>
    <path d="M180 310H220V298H500"/><path d="M180 320H225V456H260"/>
    <path d="M410 285H455V148H500"/><path d="M410 310H455V458H500"/>
    <path d="M650 148H740"/><path d="M410 278H700V148H740"/>
    <path d="M650 160H700V298H740"/><path d="M410 322H700V298H740"/>
    <path d="M180 330H200V535H1020V406"/><path d="M650 310H820V535H1020V406"/>
    <path d="M1055 176V350"/>
  </g>
  <g>
    <rect x="30" y="270" width="150" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="105" y="304" text-anchor="middle" class="entity">Escola</text>
    <rect x="30" y="100" width="150" height="56" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="105" y="134" text-anchor="middle" class="entity">EnderecoEscola</text>
    <rect x="260" y="270" width="150" height="56" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="335" y="304" text-anchor="middle" class="entity">Curso</text>
    <rect x="500" y="120" width="150" height="56" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="575" y="154" text-anchor="middle" class="entity">Aluno</text>
    <rect x="500" y="270" width="150" height="56" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="575" y="304" text-anchor="middle" class="entity">Professor</text>
    <rect x="260" y="430" width="170" height="56" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="345" y="464" text-anchor="middle" class="entity">AvaliacaoQualidade</text>
    <rect x="500" y="430" width="150" height="56" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="575" y="464" text-anchor="middle" class="entity">AvaliacaoCurso</text>
    <rect x="740" y="120" width="150" height="56" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="815" y="154" text-anchor="middle" class="entity">Matricula</text>
    <rect x="740" y="270" width="150" height="56" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="815" y="304" text-anchor="middle" class="entity">ProgressoAluno</text>
    <rect x="980" y="120" width="150" height="56" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1055" y="154" text-anchor="middle" class="entity">Produto</text>
    <rect x="980" y="350" width="150" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1055" y="384" text-anchor="middle" class="entity">Pedido</text>
  </g>
  <text x="600" y="565" text-anchor="middle" class="note">Cada seta representa 1:N da entidade de origem para a entidade dependente.</text>
  <text x="600" y="590" text-anchor="middle" class="note">Escola ↔ EnderecoEscola é 1:1. O modelo mostra relações mapeadas nos modelos JPA.</text>
  <text x="600" y="635" text-anchor="middle" class="rel">Relacionamentos: Escola–Curso/Aluno/Professor/Avaliações/Pedido · Curso–Aluno/Matrícula/Progresso/Avaliação · Aluno–Matrícula/Progresso · Produto/Professor–Pedido</text>
</svg>
